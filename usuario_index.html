<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Red Telesecundaria</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif; }
        .font-display { font-family: 'Fraunces', Georgia, serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col" style="background-color:#FBF7EE; color:#2B2620;">

    <header class="text-white shadow-md sticky top-0 z-50" style="background-color:#1F3B2C;">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="p-2 rounded-xl font-bold text-lg md:text-xl shadow-sm w-10 h-10 flex items-center justify-center transition hover:opacity-90" style="background-color:#FBF7EE; color:#1F3B2C;">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="font-display font-semibold text-sm md:text-lg leading-tight tracking-tight">Mi Perfil Docente</h1>
                    <p class="text-[10px] md:text-xs" style="color:#C9D9CE;">Red Telesecundaria</p>
                </div>
            </div>
            <div>
                <a href="index.html" class="text-xs bg-[#2F6B4F] hover:bg-[#25563E] text-white px-3.5 py-2 rounded-xl font-medium transition">
                    Volver al Foro
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- TARJETA DE CONFIGURACIÓN DE PERFIL -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border space-y-6" style="border-color:#E7DFC9;">
            <div class="flex flex-col sm:flex-row items-center gap-5">
                <div class="relative">
                    <div id="avatar-preview-container" class="w-24 h-24 rounded-full overflow-hidden border-2 flex items-center justify-center shadow-xs" style="border-color:#2F6B4F; background-color:#F3ECDC; color:#1F3B2C;">
                        <span id="avatar-placeholder" class="text-3xl font-bold">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <img id="avatar-img-preview" class="w-full h-full object-cover hidden" alt="Foto de perfil">
                    </div>
                </div>
                <div class="w-full text-center sm:text-left space-y-1">
                    <h2 id="perfil-email-display" class="text-xs font-semibold uppercase tracking-wider" style="color:#8A7F6C;">cargando...</h2>
                    <p class="text-xs" style="color:#9C927F;">Actualiza tus datos públicos para que la comunidad te reconozca fácilmente.</p>
                </div>
            </div>

            <form onsubmit="guardarPerfil(event)" class="space-y-4 pt-4 border-t" style="border-color:#F0EADA;">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[12px] font-medium mb-1.5" style="color:#6B6255;">Nombre de usuario o Docente</label>
                        <input type="text" id="input-nombre-usuario" required placeholder="Ej. Profa. María Dolores" class="w-full px-3.5 py-2.5 border rounded-xl text-xs md:text-sm bg-[#FBF7EE] border-[#E7DFC9] focus:ring-2 transition" style="--tw-ring-color:#2F6B4F;">
                    </div>
                    <div>
                        <label class="block text-[12px] font-medium mb-1.5" style="color:#6B6255;">Cambiar foto de perfil (Máx. 1 MB)</label>
                        <input type="file" id="input-foto-perfil" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold transition" style="background-color:#FBF7EE;">
                    </div>
                </div>
                <div>
                    <label class="block text-[12px] font-medium mb-1.5" style="color:#6B6255;">Descripción personal o profesional</label>
                    <textarea id="input-descripcion-usuario" rows="3" placeholder="Ej. Docente frente a grupo..." class="w-full px-3.5 py-2.5 border rounded-xl text-xs md:text-sm bg-[#FBF7EE] border-[#E7DFC9] focus:ring-2 transition" style="--tw-ring-color:#2F6B4F;"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" id="btn-guardar-perfil" class="text-white px-5 py-2.5 rounded-xl text-xs md:text-sm font-medium transition shadow-sm hover:opacity-95" style="background-color:#2F6B4F;">
                        Guardar Cambios de Perfil
                    </button>
                </div>
            </form>
        </div>

        <!-- MIS PUBLICACIONES REALIZADAS -->
        <div class="space-y-4">
            <h3 class="font-display text-lg font-semibold" style="color:#1F3B2C;">Mis Publicaciones Realizadas</h3>
            <div id="contenedor-mis-publicaciones" class="space-y-4">
                <div class="bg-white p-8 rounded-2xl text-center border text-xs" style="border-color:#E7DFC9; color:#9C927F;">Cargando tus publicaciones...</div>
            </div>
        </div>

        <!-- MIS EXPERIENCIAS DE PRÁCTICAS REALIZADAS -->
        <div class="space-y-4 pt-2">
            <h3 class="font-display text-lg font-semibold" style="color:#1F3B2C;">Mis Experiencias de Prácticas</h3>
            <div id="contenedor-mis-experiencias" class="space-y-4">
                <div class="bg-white p-8 rounded-2xl text-center border text-xs" style="border-color:#E7DFC9; color:#9C927F;">Cargando tus experiencias...</div>
            </div>
        </div>

    </main>

    <!-- Contenedor para notificaciones flotantes -->
    <div id="contenedor-notificaciones" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>
<!-- MODAL EDITAR PUBLICACIÓN -->
    <!-- MODAL EDITAR PUBLICACIÓN -->
    <div id="modal-editar-pub" class="fixed inset-0 backdrop-blur-xs hidden flex items-center justify-center z-50 p-4 overflow-y-auto" style="background-color:rgba(31,59,44,.55);">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-xl overflow-hidden p-6 relative my-auto max-h-[90vh] overflow-y-auto">
            <button onclick="cerrarModalEditar()" class="absolute top-4 right-4 p-2 transition-colors" style="color:#9C927F;">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="font-display text-lg md:text-xl font-semibold mb-2" style="color:#1F3B2C;">Editar Publicación Didáctica</h2>

            <form onsubmit="actualizarPublicacion(event)" class="space-y-3.5">
                <input type="hidden" id="edit-pub-id">
                <div>
                    <label class="block text-[12px] font-medium mb-1" style="color:#6B6255;">Título de la publicación</label>
                    <input type="text" id="edit-titulo" required class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm focus:ring-2 transition bg-[#FBF7EE] border-[#E7DFC9]" style="--tw-ring-color:#2F6B4F;">
                </div>
                <div>
                    <label class="block text-[12px] font-medium mb-1" style="color:#6B6255;">Asignatura</label>
                    <select id="edit-asignatura" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm focus:ring-2 transition bg-[#FBF7EE] border-[#E7DFC9]" style="--tw-ring-color:#2F6B4F;" required></select>
                </div>
                <div>
                    <label class="block text-[12px] font-medium mb-1" style="color:#6B6255;">Descripción o consigna</label>
                    <textarea id="edit-desc" rows="3" required class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm focus:ring-2 transition bg-[#FBF7EE] border-[#E7DFC9]" style="--tw-ring-color:#2F6B4F;"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[12px] font-medium mb-1" style="color:#6B6255;">Nuevas imágenes (Opcional, máx. 1 MB c/u)</label>
                        <input type="file" id="edit-imagenes" accept="image/*" multiple class="w-full text-xs file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold transition" style="color:#6B6255;">
                    </div>
                    <div>
                        <label class="block text-[12px] font-medium mb-1" style="color:#6B6255;">Nuevo archivo PDF / Word (Opcional)</label>
                        <input type="file" id="edit-archivo" accept=".pdf,.doc,.docx,.ppt,.pptx" class="w-full text-xs file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold transition" style="color:#6B6255;">
                    </div>
                </div>
                <button type="submit" id="btn-guardar-edicion" class="w-full text-white py-2.5 rounded-xl text-xs md:text-sm font-medium transition shadow-sm hover:opacity-95" style="background-color:#2F6B4F;">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>
    <script type="module" src="usuario_index.js"></script>
</body>
</html>
